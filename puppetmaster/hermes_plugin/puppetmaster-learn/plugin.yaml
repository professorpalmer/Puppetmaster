name: puppetmaster-learn
version: "0.2.1"
description: "When a Hermes session ends, turn a Puppetmaster swarm that finished in it (with findings or a patch) into a skill CANDIDATE under ~/.hermes/skills-candidates/ for you to review and promote. Never writes a live skill or starts an agent."
author: "professorpalmer"
homepage: "https://github.com/professorpalmer/Puppetmaster"
license: "MIT"
requires_hermes: ">=0.20.4"
provides_tools: []
provides_hooks:
  - on_session_finalize
